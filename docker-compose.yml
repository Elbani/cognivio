services:
  app:
    # The published image. "docker compose up -d" pulls it, and
    # "docker compose up -d --build" builds from this checkout instead.
    image: ghcr.io/elbani/cognivio:latest
    build: .
    env_file: .env
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: cognivio
    ports:
      - "8080:8000"
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
