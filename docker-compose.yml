services:
  app:
    build: .
    env_file: .env
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: cognivio
      # Self-hosted: no plan limits. See README, Configuration.
      SELF_HOSTED: "true"
    ports:
      - "8080:8000"
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
