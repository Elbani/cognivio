<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="t d">
  <title id="t">How Cognivio works</title>
  <desc id="d">A coding agent asks Cognivio for context before a task, receives the project map and the relevant docs, does the work, then writes back what it learned. The new doc is there for the next session.</desc>
  <rect width="960" height="400" fill="#ffffff"/>

  <rect x="40" y="70" width="260" height="250" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="64" y="106" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#1f2328">Your coding agent</text>
  <text x="64" y="128" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#59636e">Claude Code, Cursor, Codex</text>
  <text x="64" y="176" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#59636e">$ fix the login bug</text>
  <text x="64" y="204" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#59636e">reads the team's notes</text>
  <text x="64" y="232" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#59636e">edits the code</text>
  <text x="64" y="260" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#59636e">notes what it learned</text>

  <rect x="660" y="70" width="260" height="250" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="684" y="106" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#1f2328">Cognivio</text>
  <text x="684" y="128" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#59636e">Your team's knowledge base</text>
  
  <g>
    <rect x="684" y="148" width="212" height="32" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
    <text x="696" y="168.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#1f2328">Project Map</text>
    <text x="884" y="168.5" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#59636e">map</text>
  </g>
  
  <g>
    <rect x="684" y="188" width="212" height="32" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
    <text x="696" y="208.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#1f2328">Sessions use cookies</text>
    <text x="884" y="208.5" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#59636e">decision</text>
  </g>
  
  <g>
    <rect x="684" y="228" width="212" height="32" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
    <text x="696" y="248.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#1f2328">Login outage, March</text>
    <text x="884" y="248.5" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#59636e">incident</text>
  </g>
  
  <g opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.80;0.84;0.97;1"/>
    <rect x="684" y="268" width="212" height="32" rx="6" fill="#ffffff" stroke="#1a7f37" stroke-width="1.5"/>
    <text x="696" y="288.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#1f2328">Token refresh gotcha</text>
    <text x="884" y="288.5" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#1a7f37">lesson</text>
  </g>

  
  <line x1="300" y1="150" x2="652" y2="150" stroke="#d0d7de" stroke-width="1.5"/>
  <path d="M652,145 L660,150 L652,155 Z" fill="#d0d7de"/>
  <circle cx="330" cy="128" r="11" fill="none" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="330" y="132.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#1a7f37">1</text>
  <text x="350" y="132.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#1f2328">prime_context("fix the login bug")</text>
  <circle r="6" fill="#1a7f37" opacity="0">
    <animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.04;0.22;1" path="M300,150 L652,150"/>
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.04;0.05;0.22;0.24;1"/>
  </circle>
  
  <line x1="660" y1="220" x2="308" y2="220" stroke="#d0d7de" stroke-width="1.5"/>
  <path d="M308,215 L300,220 L308,225 Z" fill="#d0d7de"/>
  <circle cx="330" cy="198" r="11" fill="none" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="330" y="202.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#1a7f37">2</text>
  <text x="350" y="202.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#1f2328">map + the docs that matter</text>
  <circle r="6" fill="#1a7f37" opacity="0">
    <animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.28;0.46;1" path="M660,220 L308,220"/>
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.28;0.29000000000000004;0.46;0.48000000000000004;1"/>
  </circle>
  
  <line x1="300" y1="290" x2="652" y2="290" stroke="#d0d7de" stroke-width="1.5"/>
  <path d="M652,285 L660,290 L652,295 Z" fill="#d0d7de"/>
  <circle cx="330" cy="268" r="11" fill="none" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="330" y="272.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#1a7f37">3</text>
  <text x="350" y="272.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#1f2328">write_memory(what it learned)</text>
  <circle r="6" fill="#1a7f37" opacity="0">
    <animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.58;0.78;1" path="M300,290 L652,290"/>
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.58;0.59;0.78;0.8;1"/>
  </circle>

  <text x="480" y="366" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#1f2328">The next session starts with what this one learned.</text>
</svg>
