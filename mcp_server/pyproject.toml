[project]
name = "cognivio-mcp"
version = "0.1.0"
description = "MCP connector for Cognivio, exposes a team knowledge base to coding agents."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["mcp>=1.30.0,<2", "httpx>=0.28.1"]

[project.scripts]
cognivio-mcp = "server:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["server"]
